<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/report.css" />
  <title>matcha - 매칭 리포트</title>
  <meta name="description" content="나랑 가장 잘 맞는 상대방과의 상세 매칭 분석 리포트입니다." />
</head>
<body class="antialiased">
  <!-- Background Orbs -->
  <div class="glass-orb orb-1"></div>
  <div class="glass-orb orb-2"></div>

  <main class="report-container">
    <!-- Main Report Card -->
    <div class="report-card">
      <div class="report-header">
        <span class="report-badge">Compatibility Report</span>
        <h1 class="report-title">딱 맞는 상대를 찾았어요!</h1>
      </div>

      <div class="divider"></div>

      <div class="section">
        <h3 class="section-title">상대방</h3>
        <p class="profile-email"><a href="mailto:kimgunwoo@email.com" target="_blank">kimgunwoo@email.com</a></p>
        <p class="profile-intro">맞차 유저가 1000명이 되었으면 좋겠습니다.</p>
      </div>

      <div class="divider"></div>

      <div class="section score-section">
        <h3 class="section-title">총 궁합도</h3>
        <div class="score-display">
          <span class="score-number">86</span><span class="score-percent">%</span>
        </div>
        <p class="score-text">성격 결이 잘 맞아요!</p>
      </div>

      <div class="divider"></div>

      <div id="section-summary" class="section">
        <h3 class="section-title">분석 요약</h3>
        <ul class="summary-list">
          <li>사교적인 성향이 비슷해요</li>
          <li>에너지를 얻는 방식이 비슷해요</li>
          <li>활발한 성격이 비슷해요</li>
        </ul>
      </div>

      <!-- Dynamic Report Container -->
      <div id="report-container" class="dynamic-container"></div>

      <div id="section-analysis">
        <div class="divider" style="margin-top:0;"></div>
        <div class="section">
          <h3 class="section-title">섹션 분석</h3>
          
          <div class="progress-item">
            <div class="progress-info">
              <span>성격</span>
              <span class="progress-value">91%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 91%"></div>
            </div>
          </div>
          <div class="progress-item">
            <div class="progress-info">
              <span>가치관</span>
              <span class="progress-value">89%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 89%"></div>
            </div>
          </div>
          <div class="progress-item">
            <div class="progress-info">
              <span>라이프스타일</span>
              <span class="progress-value">76%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 76%"></div>
            </div>
          </div>
          <div class="progress-item">
            <div class="progress-info">
              <span>연애관</span>
              <span class="progress-value">84%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 84%"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="footer-copy">© matcha</p>
    </div>
  </main>

  <script type="module" src="src/js/report.js"></script>
</body>
</html>
