<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./src/css/report.css" />
<style>
  /* 버전 컨트롤 UI용 기본 스타일 */
  .version-control {
    text-align: center;
    margin-bottom: 24px;
  }
  .toggle-group {
    display: inline-flex;
    background: #e8e8e8;
    border-radius: 8px;
    padding: 4px;
  }
  .toggle-btn {
    background: transparent;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #666;
    transition: all 0.2s ease;
  }
  .toggle-btn.active {
    background: #fff;
    color: #111;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
